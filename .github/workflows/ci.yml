name: Check build and screenshots
on:
  push:
    branches: ["**"]
    paths-ignore: ["feed/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build for the simulator, test and take screenshots
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build, run and screenshot
        run: scripts/simulator-check.sh
      - name: Publish screenshots to the screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -e
          [ -d shots ] || exit 0
          git config user.name "shelf-ci"
          git config user.email "shelf-ci@users.noreply.github.com"
          rm -rf /tmp/shots && cp -R shots /tmp/shots
          git checkout --orphan screenshots-tmp
          git rm -rf --quiet . || true
          git clean -fdxq
          cp -R /tmp/shots/* .
          git add -A
          git commit -m "Screenshots for ${GITHUB_SHA::7}" --quiet
          git push -f origin HEAD:screenshots
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simulator-check
          path: |
            shots
            build.log
