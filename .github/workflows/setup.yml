name: 1. Set up with Apple
on:
  workflow_dispatch:
    inputs:
      step:
        description: "What to do"
        type: choice
        options: [check, identifiers, certificates, testers]
        default: check

jobs:
  setup:
    name: ${{ inputs.step }}
    runs-on: macos-26
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Check the secrets are available
        run: |
          missing=""
          for s in TEAMID GH_PAT FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY MATCH_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
          echo "All six secrets are available."
      - uses: actions/checkout@v5
      - name: Install fastlane
        run: bundle install
      - name: Run
        run: |
          case "${{ inputs.step }}" in
            identifiers) bundle exec fastlane identifiers ;;
            certificates) bundle exec fastlane certs ;;
            testers) bundle exec fastlane testers ;;
            *) bundle exec fastlane check_setup ;;
          esac
